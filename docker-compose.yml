version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartvcard-db
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpassword
      POSTGRES_DB: smartvcard
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartuser -d smartvcard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: smartvcard-backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://smartuser:smartpassword@db:5432/smartvcard?schema=public
      - PORT=3001
      - JWT_SECRET=supersecret123
      - FRONTEND_URL=http://localhost:3005
      - SMTP_HOST=smtp.hostinger.com
      - SMTP_PORT=465
      - SMTP_SECURE=true
      - SMTP_USER=suporte@simplisoft.com.br
      - SMTP_PASS=Vydhal@112358
      - SMTP_FROM=suporte@simplisoft.com.br
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: smartvcard-frontend
    ports:
      - "3005:3000"
    environment:
      - NUXT_ENV_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
