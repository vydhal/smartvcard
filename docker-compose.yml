version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartvcard-db
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpassword
      POSTGRES_DB: smartvcard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: smartvcard-backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://smartuser:smartpassword@db:5432/smartvcard?schema=public
      - PORT=3001
      - JWT_SECRET=supersecret123
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: smartvcard-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
